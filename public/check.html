<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check an idea · Demand Radar</title>
<meta name="description" content="Check demand for any idea, product or service in the Netherlands, Germany or the US: real monthly searches, growth, ad price and what people type.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles.css">
</head>
<body class="clean">
<div class="top"><div class="top-in">
  <a class="brand" href="/">demand<span>radar</span></a>
  <a class="scan ghost" href="/">Back to the radar</a>
</div></div>

<main>
  <h1>Check an idea.</h1>
  <p class="lead">Real monthly searches, growth, ad price and what people type. Netherlands, Germany or the US.</p>
  <form class="ckform" id="check" novalidate>
    <input id="q" name="q" maxlength="80" autocomplete="off" placeholder="Idea, product or service, e.g. thuisbatterij" aria-label="Idea, product or service">
    <select id="m" name="m" aria-label="Country"><option value="NL">Netherlands</option><option value="DE">Germany</option><option value="US">United States</option></select>
    <input id="c" name="c" maxlength="60" autocomplete="off" placeholder="City (optional)" aria-label="City, optional">
    <button class="cta" type="submit" id="go">Check</button>
  </form>
  <p class="status" id="note">&nbsp;</p>
  <div id="result"></div>
</main>

<footer class="site"><div class="in"><div class="co">Demand Radar is a service of ADSFAIR B.V., Albert Plesmanplein 20, 2805 AB Gouda, the Netherlands · VAT NL853775485B01 · henkjan@adsfair.xyz</div></div></footer>
<script src="/check.js" defer></script>
</body>
</html>
